<!DOCTYPE html>
<html lang="az">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Al-Capilot // Auto-Discovery Omni Route</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
    body { background: #030811; color: #e0f7ff; padding: 10px; display: flex; flex-direction: column; gap: 10px; }
    .box { background: #07172b; border: 1px solid #00f3ff44; border-radius: 10px; padding: 10px; display: flex; flex-direction: column; gap: 8px; }
    .row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
    input, select, textarea { flex: 1; min-width: 120px; background: #020a14; color: #fff; border: 1px solid #00f3ff44; border-radius: 8px; padding: 9px; font-size: 0.88rem; }
    textarea { width: 100%; min-height: 95px; font-family: monospace; font-size: 0.8rem; }
    button { background: #00f3ff22; color: #00f3ff; border: 1px solid #00f3ff; border-radius: 8px; padding: 8px 10px; font-weight: bold; font-size: 0.78rem; cursor: pointer; }
    .btn-g { color: #00ff9d; border-color: #00ff9d; background: #00ff9d18; }
    .chat { height: 230px; overflow-y: auto; display: flex; flex-direction: column; gap: 7px; padding: 6px; background: #020a14; border-radius: 8px; border: 1px solid #00f3ff22; }
    .msg { padding: 8px 10px; border-radius: 8px; font-size: 0.86rem; white-space: pre-wrap; max-width: 92%; line-height: 1.4; }
    .u { align-self: flex-end; background: #1d4ed8; color: #fff; }
    .b { align-self: flex-start; background: #0d243f; border: 1px solid #00ff9d55; }
    .err { align-self: flex-start; background: #3b0d16; border: 1px solid #ff4d6d; color: #ffd6de; }
    .muted { font-size: 0.76rem; color: #9bc4dc; }
  </style>
</head>
<body>
  <div class="box">
    <div class="row" style="justify-content: space-between;">
      <strong>AL-CAPILOT // AUTO OMNI ROUTE</strong>
      <span id="clk" class="muted">00:00:00</span>
    </div>
    <div id="stat" class="muted">Açar daxil edin — işləyən model avtomatik tapılacaq</div>
  </div>

  <div class="box">
    <strong>OMNI ROUTE (AVTOMATİK VERSİYA AXTARIŞI)</strong>
    <div class="row">
      <select id="prov">
        <option value="gemini">Google Gemini</option>
        <option value="groq">Groq</option>
        <option value="openrouter">OpenRouter</option>
        <option value="render">Render Backend</option>
      </select>
      <input id="apiKey" type="text" placeholder="API açarını yapışdırın...">
      <button type="button" class="btn-g" onclick="saveAndScan()">Yadda Saxla və Tap</button>
    </div>
    <div id="keyStatus" class="muted"></div>
  </div>

  <div class="box">
    <strong>CANLI ÇAT (ADSENSE & VİDEO REKLAM)</strong>
    <div class="chat" id="chat"></div>
    <div class="row">
      <input id="inp" type="text" placeholder="Sorğu yazın..." onkeydown="if(event.key==='Enter'){ event.preventDefault(); sendMsg(); }">
      <button type="button" class="btn-g" onclick="sendMsg()">Göndər</button>
      <button type="button" onclick="clearChat()">Təmizlə</button>
    </div>
    <div class="row">
      <button type="button" onclick="sendPreset('Saytım üçün Google AdSense təsdiq və RPM artırma audit planı qur.')">AdSense Audit</button>
      <button type="button" onclick="sendPreset('Video reklam satışı üçün sponsorluq paketləri və müştəriyə satış təklifi yaz.')">Video Reklam</button>
    </div>
  </div>

  <div class="box">
    <strong>KOD STUDİYASI</strong>
    <div class="row">
      <button type="button" class="btn-g" onclick="sendPreset('Video reklam yerləşdirməsi üçün təmiz HTML və JS kodu yaz.')">AI Video Ad Kodu</button>
      <button type="button" onclick="checkSyntax()">JS Xəta Yoxla</button>
    </div>
    <textarea id="codeArea" placeholder="Kod burada..."></textarea>
  </div>

  <script>
    const STORE = 'al_auto_omni_v3';
    const RENDER_URL = 'https://al-business-backend.onrender.com/run';
    const SYS = 'Sən Google AdSense mütəxəssisi və video reklam satışı üzrə məsləhətçisən. Praktik və aydın cavab ver.';

    let cfg = { active: 'gemini', keys: { gemini: '', groq: '', openrouter: '', render: '' }, working: {} };
    try {
      const s = JSON.parse(localStorage.getItem(STORE) || 'null');
      if (s && s.keys) cfg = { ...cfg, ...s, keys: { ...cfg.keys, ...s.keys }, working: s.working || {} };
    } catch {}

    setInterval(() => { document.getElementById('clk').textContent = new Date().toTimeString().slice(0, 8); }, 1000);
    function persist() { localStorage.setItem(STORE, JSON.stringify(cfg)); syncUI(); }

    function syncUI() {
      document.getElementById('prov').value = cfg.active;
      const info = ['gemini', 'groq', 'openrouter'].map(p => {
        const has = cfg.keys[p] ? 'VAR' : 'YOX';
        const mod = cfg.working[p] ? ' (' + cfg.working[p] + ')' : '';
        return p.toUpperCase() + ': ' + has + mod;
      }).join(' | ');
      document.getElementById('keyStatus').textContent = 'Aktiv: ' + cfg.active.toUpperCase() + ' | ' + info;
    }

    function addBubble(cls, title, text) {
      const box = document.getElementById('chat');
      const d = document.createElement('div');
      d.className = 'msg ' + cls;
      d.innerHTML = '<div style="font-size:0.7rem;opacity:0.75;margin-bottom:3px;">' + title + '</div>' +
        String(text || '').replace(/</g, '&lt;').replace(/>/g, '&gt;');
      box.appendChild(d);
      box.scrollTop = box.scrollHeight;
    }
    function clearChat() { document.getElementById('chat').innerHTML = ''; }

    async function discoverModels(prov, key) {
      if (prov === 'gemini') {
        const res = await fetch('https://generativelanguage.googleapis.com/v1beta/models?key=' + encodeURIComponent(key));
        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error('Gemini Siyahı (' + res.status + '): ' + (data.error?.message || res.statusText));
        const list = (data.models || [])
          .filter(m => (m.supportedGenerationMethods || []).includes('generateContent'))
          .map(m => m.name.replace(/^models\//, ''))
          .filter(n => !/embedding|imagen|veo|aqa|tts|audio/i.test(n));
        list.sort((a, b) => (/flash/i.test(b) - /flash/i.test(a)));
        return list.length ? list : ['gemini-2.0-flash', 'gemini-1.5-flash', 'gemini-pro'];
      }
      if (prov === 'groq') {
        const res = await fetch('https://api.groq.com/openai/v1/models', { headers: { Authorization: 'Bearer ' + key } });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error('Groq Siyahı (' + res.status + '): ' + (data.error?.message || res.statusText));
        const list = (data.data || []).map(m => m.id).filter(id => !/whisper|guard|tts|audio/i.test(id));
        list.sort((a, b) => (/llama-3\.3|llama-3\.1|gemma/i.test(b) - /llama-3\.3|llama-3\.1|gemma/i.test(a)));
        return list.length ? list : ['llama-3.1-8b-instant', 'gemma2-9b-it'];
      }
      if (prov === 'openrouter') {
        const res = await fetch('https://openrouter.ai/api/v1/models');
        const data = await res.json().catch(() => ({}));
        const free = (data.data || []).map(m => m.id).filter(id => id.endsWith(':free')).slice(0, 8);
        return ['openrouter/free', ...free];
      }
      return [];
    }

    async function tryModel(prov, key, model, prompt) {
      if (prov === 'gemini') {
        const res = await fetch('https://generativelanguage.googleapis.com/v1beta/models/' + encodeURIComponent(model) + ':generateContent?key=' + encodeURIComponent(key), {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ contents: [{ parts: [{ text: SYS + '\n\n' + prompt }] }] })
        });
        const d = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(model + ' -> ' + res.status + ': ' + (d.error?.message || res.statusText));
        const txt = d.candidates?.[0]?.content?.parts?.map(p => p.text || '').join('').trim();
        if (!txt) throw new Error(model + ' -> boş cavab');
        return txt;
      }
      const url = prov === 'groq' ? 'https://api.groq.com/openai/v1/chat/completions' : 'https://openrouter.ai/api/v1/chat/completions';
      const headers = { 'Content-Type': 'application/json', Authorization: 'Bearer ' + key };
      if (prov === 'openrouter') { headers['HTTP-Referer'] = location.origin || 'https://al-capilot.github.io'; headers['X-Title'] = 'Al-Capilot'; }
      const res = await fetch(url, {
        method: 'POST',
        headers,
        body: JSON.stringify({ model, messages: [{ role: 'system', content: SYS }, { role: 'user', content: prompt }] })
      });
      const d = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(model + ' -> ' + res.status + ': ' + (d.error?.message || res.statusText));
      const txt = d.choices?.[0]?.message?.content?.trim();
      if (!txt) throw new Error(model + ' -> boş cavab');
      return txt;
    }

    async function runProviderAuto(prov, prompt) {
      const key = cfg.keys[prov] || '';
      if (prov === 'render') {
        const res = await fetch(key.startsWith('http') ? key : RENDER_URL, {
          method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ prompt: SYS + '\n\n' + prompt })
        });
        const d = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error('Render -> ' + res.status);
        const txt = String(d.answer || d.response || d.result || d.output || d.text || d.message || '').trim();
        if (!txt) throw new Error('Render -> boş cavab');
        return { model: 'render-backend', text: txt };
      }
      if (!key) throw new Error(prov.toUpperCase() + ' açarı yoxdur');

      const discovered = await discoverModels(prov, key);
      const candidates = [cfg.working[prov], ...discovered].filter((v, i, a) => v && a.indexOf(v) === i);
      let lastErr = '';

      for (const model of candidates) {
        document.getElementById('stat').textContent = prov.toUpperCase() + ' yoxlanır: ' + model;
        try {
          const text = await tryModel(prov, key, model, prompt);
          cfg.working[prov] = model;
          persist();
          return { model, text };
        } catch (e) {
          lastErr = e.message;
        }
      }
      throw new Error(lastErr || prov + ' işləyən model tapılmadı');
    }

    async function saveAndScan() {
      const prov = document.getElementById('prov').value;
      const val = document.getElementById('apiKey').value.replace(/\s+/g, '');
      cfg.active = prov;
      if (val) { cfg.keys[prov] = val; delete cfg.working[prov]; }
      document.getElementById('apiKey').value = '';
      persist();

      document.getElementById('stat').textContent = prov.toUpperCase() + ' modelləri axtarılır...';
      try {
        const res = await runProviderAuto(prov, 'Yalnız "OK" yaz.');
        document.getElementById('stat').textContent = 'Tapıldı: ' + prov.toUpperCase() + ' -> ' + res.model;
        addBubble('b', prov.toUpperCase() + ' (' + res.model + ')', 'İşlək model tapıldı və bağlandı: ' + res.model);
      } catch (err) {
        document.getElementById('stat').textContent = 'Xəta: ' + err.message;
        addBubble('err', prov.toUpperCase() + ' XƏTA', err.message);
      }
    }

    async function sendMsg() {
      const inp = document.getElementById('inp');
      const prompt = inp.value.trim();
      if (!prompt) { inp.focus(); return; }
      inp.value = '';
      addBubble('u', 'SİZ', prompt);

      const order = [cfg.active, 'gemini', 'groq', 'openrouter', 'render'].filter((v, i, a) => a.indexOf(v) === i);
      const errs = [];
      for (const prov of order) {
        if (prov !== 'render' && !cfg.keys[prov]) continue;
        try {
          const out = await runProviderAuto(prov, prompt);
          document.getElementById('stat').textContent = 'Cavab: ' + prov.toUpperCase() + ' (' + out.model + ')';
          addBubble('b', prov.toUpperCase() + ' // ' + out.model, out.text);
          if (out.text.includes('```') || out.text.includes('<script') || out.text.includes('function ')) {
            document.getElementById('codeArea').value = out.text;
          }
          return;
        } catch (e) {
          errs.push(e.message);
        }
      }
      document.getElementById('stat').textContent = 'Heç bir provayder cavab vermədi';
      addBubble('err', 'OMNI ROUTE XƏTA', errs.length ? errs.join('\n') : 'Açar daxil edib "Yadda Saxla və Tap" basın.');
    }

    function sendPreset(t) { document.getElementById('inp').value = t; sendMsg(); }
    function checkSyntax() {
      const raw = document.getElementById('codeArea').value.replace(/```[a-z]*\n?/gi, '').replace(/```/g, '').trim();
      if (!raw) return;
      try { new Function(raw); document.getElementById('stat').textContent = 'JS sintaksisi düzgündür.'; }
      catch (e) { document.getElementById('stat').textContent = 'JS xəta: ' + e.message; }
    }

    syncUI();
  </script>
</body>
</html>
