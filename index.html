<!DOCTYPE html>
<html lang="az">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Al-Capilot // AdSense & Video Ad OS</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
    body { background: #030811; color: #e0f7ff; padding: 10px; display: flex; flex-direction: column; gap: 10px; }
    .box { background: #07172b; border: 1px solid #00f3ff44; border-radius: 10px; padding: 10px; display: flex; flex-direction: column; gap: 8px; }
    .row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
    input, select, textarea { flex: 1; min-width: 120px; background: #020a14; color: #fff; border: 1px solid #00f3ff44; border-radius: 8px; padding: 9px; font-size: 0.88rem; }
    textarea { width: 100%; min-height: 110px; font-family: monospace; font-size: 0.8rem; }
    button { background: #00f3ff22; color: #00f3ff; border: 1px solid #00f3ff; border-radius: 8px; padding: 8px 10px; font-weight: bold; font-size: 0.78rem; cursor: pointer; }
    .btn-g { color: #00ff9d; border-color: #00ff9d; background: #00ff9d18; }
    .chat { height: 220px; overflow-y: auto; display: flex; flex-direction: column; gap: 7px; padding: 6px; background: #020a14; border-radius: 8px; border: 1px solid #00f3ff22; }
    .msg { padding: 8px 10px; border-radius: 8px; font-size: 0.86rem; white-space: pre-wrap; max-width: 92%; line-height: 1.4; }
    .u { align-self: flex-end; background: #1d4ed8; color: #fff; }
    .b { align-self: flex-start; background: #0d243f; border: 1px solid #00ff9d55; }
    .muted { font-size: 0.76rem; color: #9bc4dc; }
  </style>
</head>
<body>
  <div class="box">
    <div class="row" style="justify-content: space-between;">
      <strong>AL-CAPILOT // ADSENSE & VIDEO AD OS</strong>
      <span id="clk" class="muted">00:00:00</span>
    </div>
    <div id="stat" class="muted">Status: Aktiv (Açarsız rejim)</div>
  </div>

  <div class="box">
    <div class="row" style="justify-content: space-between;">
      <strong>CANLI ÇAT YAZIŞMASI</strong>
      <div class="row" style="gap: 5px;">
        <select id="lang" style="min-width: 65px; padding: 5px;">
          <option value="az-AZ">AZ</option>
          <option value="tr-TR">TR</option>
          <option value="en-US">EN</option>
        </select>
        <button type="button" id="ttsBtn" onclick="toggleTTS()">🔊 Səs: Sönülü</button>
        <button type="button" onclick="clearChat()">Təmizlə</button>
      </div>
    </div>

    <div class="chat" id="chat"></div>

    <div class="row">
      <input id="inp" type="text" placeholder="Mesaj yazın (məs: Salam, AdSense audit, Video reklam)..." onkeydown="if(event.key==='Enter'){ event.preventDefault(); sendCmd(); }">
      <button type="button" onclick="startMic()">🎙️</button>
      <button type="button" class="btn-g" onclick="sendCmd()">Göndər</button>
    </div>

    <div class="row">
      <button type="button" class="btn-g" onclick="adsenseAudit()">📊 AdSense Audit</button>
      <button type="button" class="btn-g" onclick="videoAdPitch()">🎬 Video Reklam</button>
      <button type="button" onclick="checkSys()">🔍 Yoxla</button>
    </div>
  </div>

  <div class="box">
    <strong>OMNI ROUTE (AVTOMATİK KEÇİD)</strong>
    <div class="row">
      <select id="prov">
        <option value="render">Render Backend</option>
        <option value="gemini">Gemini</option>
        <option value="groq">Groq</option>
        <option value="openrouter">OpenRouter</option>
      </select>
      <input id="apiKey" type="password" placeholder="API Key (istəyə bağlı)">
      <button type="button" onclick="addRoute()">+ Əlavə Et</button>
    </div>
    <div id="routes" class="muted">Marşrut: render -> gemini -> groq -> openrouter -> lokal</div>
  </div>

  <div class="box">
    <strong>KOD STUDİYASI (VİDEO REKLAM / JS / XƏTA DÜZƏLTMƏ)</strong>
    <div class="row">
      <button type="button" class="btn-g" onclick="genVideoAd()">🎬 Video Ad Kodu</button>
      <button type="button" onclick="genJS()">⚙️ JS Modul Yaz</button>
      <button type="button" onclick="fixCode()">🛠️ Xəta Düzəlt</button>
      <button type="button" onclick="dlCode()">⬇️ Yüklə</button>
    </div>
    <textarea id="codeArea" placeholder="Video reklam və ya JS kodu burada görünəcək..."></textarea>
  </div>

  <script>
    const CHAT_KEY = 'al_all_in_one_v1';
    const RENDER_URL = 'https://al-business-backend.onrender.com/run';
    let ttsOn = false;
    let routes = [{ prov: 'render', key: '' }, { prov: 'gemini', key: '' }, { prov: 'groq', key: '' }, { prov: 'openrouter', key: '' }];
    const SYS = 'Sən Google AdSense mütəxəssisi və video reklam satışı üzrə strateqsən. Qısa, praktik və gəlir yönümlü cavab ver.';

    setInterval(() => { document.getElementById('clk').textContent = new Date().toTimeString().slice(0, 8); }, 1000);

    function getChat() { try { return JSON.parse(localStorage.getItem(CHAT_KEY) || '[]'); } catch { return []; } }
    function addMsg(who, text) {
      const list = getChat();
      list.push({ who, text });
      localStorage.setItem(CHAT_KEY, JSON.stringify(list.slice(-40)));
      renderChat();
    }
    function clearChat() { localStorage.removeItem(CHAT_KEY); renderChat(); }
    function renderChat() {
      const box = document.getElementById('chat');
      const list = getChat();
      box.innerHTML = list.length
        ? list.map(m => '<div class="msg ' + (m.who === 'u' ? 'u' : 'b') + '">' + String(m.text).replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</div>').join('')
        : '<div class="msg b">Salam! Çat hazırdır. Açar olmadan da "Salam" yazın və ya düymələri sıxın.</div>';
      box.scrollTop = box.scrollHeight;
    }

    function adsenseText(t) {
      return '📊 ADSENSE AUDİT' + (t ? ' (' + t + ')' : '') + ':\n1. Unikal məzmun və aydın menyu quruluşu saxlayın.\n2. Reklam yerlərinə sabit hündürlük verin (CLS < 0.1).\n3. Klikə məcburetmə və saxta düymələrdən çəkinin.\n4. İlk ekran + məqalə içi + sonu blokları ilə RPM-i artırın.';
    }
    function videoText(t) {
      return '🎬 VİDEO REKLAM SATIŞI (' + (t || 'Platforma') + '):\n1. 15–30 san sponsorlu video + promo-kod/CTA.\n2. Pre-roll / mid-roll yerləşdirmə.\n3. Satış təklifi: "Hədəf auditoriyaya birbaşa video təqdimatla yüksək dönüşüm əldə edin."';
    }
    function localBot(q) {
      const s = q.toLowerCase();
      if (/salam|sal|hello|hi|necəsən|necesen/.test(s)) return 'Salam! Al-Capilot AdSense və Video Reklam agenti aktivdir. Nə edək?';
      if (/adsense|reklam|rpm|ctr|təsdiq/.test(s)) return adsenseText(q);
      if (/video|satış|satis|sponsor|paket/.test(s)) return videoText(q);
      return 'Qəbul edildi: "' + q + '"\nAdSense analizi üçün "📊 AdSense Audit", satış paketi üçün "🎬 Video Reklam" basın.';
    }

    async function callProv(r, prompt) {
      const c = new AbortController();
      const id = setTimeout(() => c.abort(), 6000);
      try {
        if (r.prov === 'render') {
          const res = await fetch(RENDER_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ prompt }), signal: c.signal });
          if (!res.ok) throw new Error();
          const d = await res.json();
          return d.answer || d.response || d.result || d.output || d.text || d.message || '';
        }
        if (!r.key) return '';
        if (r.prov === 'gemini') {
          const res = await fetch('https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=' + encodeURIComponent(r.key), {
            method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] }), signal: c.signal
          });
          const d = await res.json();
          return d.candidates?.[0]?.content?.parts?.[0]?.text || '';
        }
        const url = r.prov === 'groq' ? 'https://api.groq.com/openai/v1/chat/completions' : 'https://openrouter.ai/api/v1/chat/completions';
        const model = r.prov === 'groq' ? 'llama-3.3-70b-versatile' : 'openrouter/free';
        const res = await fetch(url, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + r.key },
          body: JSON.stringify({ model, messages: [{ role: 'user', content: prompt }] }),
          signal: c.signal
        });
        const d = await res.json();
        return d.choices?.[0]?.message?.content || '';
      } finally { clearTimeout(id); }
    }

    async function sendCmd() {
      const inp = document.getElementById('inp');
      const q = inp.value.trim();
      if (!q) { inp.focus(); return; }
      inp.value = '';
      addMsg('u', q);
      document.getElementById('stat').textContent = 'Cavab hazırlanır...';
      let reply = '';
      for (const r of routes) {
        try { reply = await callProv(r, SYS + '\n\n' + q); if (reply) break; } catch {}
      }
      if (!reply) reply = localBot(q);
      addMsg('b', reply);
      document.getElementById('stat').textContent = 'Hazırdır';
      if (ttsOn && 'speechSynthesis' in window) {
        const u = new SpeechSynthesisUtterance(reply.slice(0, 240));
        u.lang = document.getElementById('lang').value;
        speechSynthesis.speak(u);
      }
    }

    function adsenseAudit() { const t = document.getElementById('inp').value.trim(); addMsg('u', 'AdSense Audit'); addMsg('b', adsenseText(t)); }
    function videoAdPitch() { const t = document.getElementById('inp').value.trim(); addMsg('u', 'Video Reklam Satışı'); addMsg('b', videoText(t)); }
    function toggleTTS() { ttsOn = !ttsOn; document.getElementById('ttsBtn').textContent = ttsOn ? '🔊 Səs: Açıq' : '🔊 Səs: Sönülü'; }
    function startMic() {
      const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
      const inp = document.getElementById('inp');
      if (!SR) { inp.focus(); document.getElementById('stat').textContent = 'Klaviatura mikrofonu ilə danışın və ya yazın.'; return; }
      const rec = new SR();
      rec.lang = document.getElementById('lang').value;
      rec.onresult = (e) => { inp.value = e.results[0][0].transcript; sendCmd(); };
      rec.start();
    }
    function addRoute() {
      const prov = document.getElementById('prov').value;
      const key = document.getElementById('apiKey').value.trim();
      routes = [{ prov, key }, ...routes.filter(x => x.prov !== prov)];
      document.getElementById('apiKey').value = '';
      document.getElementById('routes').textContent = 'Marşrut: ' + routes.map(x => x.prov).join(' -> ') + ' -> lokal';
    }
    function checkSys() {
      const info = 'Onlayn: ' + navigator.onLine + ' | Dil: ' + navigator.language;
      document.getElementById('stat').textContent = info;
      addMsg('b', 'Sistem yoxlandı: ' + info);
    }
    function genVideoAd() {
      document.getElementById('codeArea').value = '<div id="video-ad"><video controls style="width:100%"><source src="VIDEO_URL" type="video/mp4"></video></div>';
    }
    function genJS() {
      document.getElementById('codeArea').value = 'function adRevenueTracker(views, rpm) {\n  return ((views / 1000) * rpm).toFixed(2) + " USD";\n}\nconsole.log(adRevenueTracker(10000, 2.5));';
    }
    function fixCode() {
      const a = document.getElementById('codeArea');
      if (!a.value.trim() || a.value.includes('<')) return;
      try { new Function(a.value); document.getElementById('stat').textContent = 'Kodda xəta yoxdur.'; }
      catch (e) { a.value = 'try {\n' + a.value + '\n} catch (err) { console.error(err); }'; document.getElementById('stat').textContent = 'Xəta düzəldildi: ' + e.message; }
    }
    function dlCode() {
      const b = new Blob([document.getElementById('codeArea').value], { type: 'text/html' });
      const u = URL.createObjectURL(b);
      const l = document.createElement('a');
      l.href = u; l.download = 'adsense-video-modul.html'; l.click();
      URL.revokeObjectURL(u);
    }
    renderChat();
  </script>
</body>
</html>
