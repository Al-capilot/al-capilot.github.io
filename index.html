<!DOCTYPE html>
<html lang="az">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Al-Capilot // Real Gemini Omni Route</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
    body { background: #030811; color: #e0f7ff; padding: 10px; display: flex; flex-direction: column; gap: 10px; }
    .box { background: #07172b; border: 1px solid #00f3ff44; border-radius: 10px; padding: 10px; display: flex; flex-direction: column; gap: 8px; }
    .row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
    input, select, textarea { flex: 1; min-width: 120px; background: #020a14; color: #fff; border: 1px solid #00f3ff44; border-radius: 8px; padding: 9px; font-size: 0.88rem; }
    textarea { width: 100%; min-height: 95px; font-family: monospace; font-size: 0.8rem; }
    button { background: #00f3ff22; color: #00f3ff; border: 1px solid #00f3ff; border-radius: 8px; padding: 8px 10px; font-weight: bold; font-size: 0.78rem; cursor: pointer; }
    .btn-g { color: #00ff9d; border-color: #00ff9d; background: #00ff9d18; }
    .chat { height: 230px; overflow-y: auto; display: flex; flex-direction: column; gap: 7px; padding: 6px; background: #020a14; border-radius: 8px; border: 1px solid #00f3ff22; }
    .msg { padding: 8px 10px; border-radius: 8px; font-size: 0.86rem; white-space: pre-wrap; max-width: 92%; line-height: 1.4; }
    .u { align-self: flex-end; background: #1d4ed8; color: #fff; }
    .b { align-self: flex-start; background: #0d243f; border: 1px solid #00ff9d55; }
    .err { align-self: flex-start; background: #3b0d16; border: 1px solid #ff4d6d; color: #ffd6de; }
    .muted { font-size: 0.76rem; color: #9bc4dc; }
  </style>
</head>
<body>
  <div class="box">
    <div class="row" style="justify-content: space-between;">
      <strong>AL-CAPILOT // REAL GEMINI OMNI ROUTE</strong>
      <span id="clk" class="muted">00:00:00</span>
    </div>
    <div id="stat" class="muted">Açar daxil edin və ya sorğu göndərin</div>
  </div>

  <div class="box">
    <strong>OMNI ROUTE AÇAR VƏ PROVAYDER</strong>
    <div class="row">
      <select id="prov">
        <option value="gemini">Gemini (gemini-2.5-flash)</option>
        <option value="groq">Groq (llama-3.3-70b-versatile)</option>
        <option value="openrouter">OpenRouter (openrouter/free)</option>
        <option value="render">Render Backend</option>
      </select>
      <input id="apiKey" type="text" placeholder="API açarını buraya yapışdırın">
      <button type="button" class="btn-g" onclick="saveKey()">Yadda Saxla</button>
      <button type="button" onclick="testGemini()">Gemini Test</button>
    </div>
    <div id="keyStatus" class="muted"></div>
  </div>

  <div class="box">
    <strong>CANLI ÇAT (AD-SENSE & VİDEO REKLAM)</strong>
    <div class="chat" id="chat"></div>
    <div class="row">
      <input id="inp" type="text" placeholder="Sorğu yazın (məs: AdSense audit planı qur)..." onkeydown="if(event.key==='Enter'){ event.preventDefault(); sendMsg(); }">
      <button type="button" class="btn-g" onclick="sendMsg()">Göndər</button>
      <button type="button" onclick="clearChat()">Təmizlə</button>
    </div>
    <div class="row">
      <button type="button" onclick="sendPreset('Saytım üçün Google AdSense təsdiq və RPM artırma audit planı qur.')">AdSense Sorğusu</button>
      <button type="button" onclick="sendPreset('Video reklam satışı üçün sponsorluq paketləri və müştəriyə satış təklifi yaz.')">Video Reklam Sorğusu</button>
    </div>
  </div>

  <div class="box">
    <strong>KOD YARATMA / YOXLAMA</strong>
    <div class="row">
      <button type="button" class="btn-g" onclick="sendPreset('Video reklam yerləşdirməsi üçün təmiz HTML və JS kodu yaz.')">AI ilə Video Ad Kodu</button>
      <button type="button" onclick="checkSyntax()">JS Xəta Yoxla</button>
    </div>
    <textarea id="codeArea" placeholder="AI kod cavabı və ya JS kodu burada..."></textarea>
  </div>

  <script>
    const STORAGE_KEY = 'al_real_omni_config_v1';
    const RENDER_URL = 'https://al-business-backend.onrender.com/run';
    const SYS_ROLE = 'Sən Google AdSense mütəxəssisi və rəqəmsal video reklam satışı üzrə məsləhətçisən. Konkret, aydın və praktik cavab ver.';

    let cfg = {
      active: 'gemini',
      keys: { gemini: '', groq: '', openrouter: '', render: '' }
    };

    try {
      const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null');
      if (saved && saved.keys) {
        cfg = {
          active: saved.active || 'gemini',
          keys: { ...cfg.keys, ...saved.keys }
        };
      }
    } catch {}

    setInterval(() => {
      document.getElementById('clk').textContent = new Date().toTimeString().slice(0, 8);
    }, 1000);

    function syncUI() {
      document.getElementById('prov').value = cfg.active;
      const gKey = cfg.keys.gemini || '';
      const activeKey = cfg.keys[cfg.active] || '';
      document.getElementById('keyStatus').textContent =
        'Aktiv provayder: ' + cfg.active.toUpperCase() +
        ' | Gemini açarı: ' + (gKey ? 'QEYD OLUNUB (' + gKey.slice(0, 6) + '...)' : 'YOXDUR') +
        ' | Seçilmiş provayder açarı: ' + (activeKey ? 'VAR' : (cfg.active === 'render' ? 'URL aktiv' : 'YOXDUR'));
    }

    function saveKey() {
      const prov = document.getElementById('prov').value;
      const val = document.getElementById('apiKey').value.replace(/\s+/g, '');
      cfg.active = prov;
      if (val) {
        cfg.keys[prov] = val;
      }
      localStorage.setItem(STORAGE_KEY, JSON.stringify(cfg));
      document.getElementById('apiKey').value = '';
      syncUI();
      document.getElementById('stat').textContent = prov.toUpperCase() + ' yadda saxlandı.';
    }

    function addBubble(cls, title, text) {
      const box = document.getElementById('chat');
      const div = document.createElement('div');
      div.className = 'msg ' + cls;
      const safe = String(text || '').replace(/</g, '&lt;').replace(/>/g, '&gt;');
      div.innerHTML = '<div style="font-size:0.7rem;opacity:0.75;margin-bottom:3px;">' + title + '</div>' + safe;
      box.appendChild(div);
      box.scrollTop = box.scrollHeight;
    }

    function clearChat() {
      document.getElementById('chat').innerHTML = '';
    }

    async function callProvider(prov, key, prompt) {
      if (prov === 'gemini') {
        if (!key) throw new Error('Gemini API açarı daxil edilməyib.');
        const url = 'https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=' + encodeURIComponent(key);
        const res = await fetch(url, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            systemInstruction: { parts: [{ text: SYS_ROLE }] },
            contents: [{ parts: [{ text: prompt }] }]
          })
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) {
          throw new Error('Gemini Xəta (' + res.status + '): ' + (data.error?.message || res.statusText));
        }
        const text = data.candidates?.[0]?.content?.parts?.map(p => p.text || '').join('').trim();
        if (!text) throw new Error('Gemini boş cavab qaytardı.');
        return text;
      }

      if (prov === 'groq') {
        if (!key) throw new Error('Groq API açarı daxil edilməyib.');
        const res = await fetch('https://api.groq.com/openai/v1/chat/completions', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': 'Bearer ' + key
          },
          body: JSON.stringify({
            model: 'llama-3.3-70b-versatile',
            messages: [
              { role: 'system', content: SYS_ROLE },
              { role: 'user', content: prompt }
            ]
          })
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error('Groq Xəta (' + res.status + '): ' + (data.error?.message || res.statusText));
        const text = data.choices?.[0]?.message?.content?.trim();
        if (!text) throw new Error('Groq boş cavab qaytardı.');
        return text;
      }

      if (prov === 'openrouter') {
        if (!key) throw new Error('OpenRouter API açarı daxil edilməyib.');
        const res = await fetch('https://openrouter.ai/api/v1/chat/completions', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': 'Bearer ' + key,
            'HTTP-Referer': location.origin || 'https://al-capilot.github.io',
            'X-Title': 'Al-Capilot'
          },
          body: JSON.stringify({
            model: 'openrouter/free',
            messages: [
              { role: 'system', content: SYS_ROLE },
              { role: 'user', content: prompt }
            ]
          })
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error('OpenRouter Xəta (' + res.status + '): ' + (data.error?.message || res.statusText));
        const text = data.choices?.[0]?.message?.content?.trim();
        if (!text) throw new Error('OpenRouter boş cavab qaytardı.');
        return text;
      }

      if (prov === 'render') {
        const targetUrl = key && key.startsWith('http') ? key : RENDER_URL;
        const res = await fetch(targetUrl, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ prompt: SYS_ROLE + '\n\n' + prompt })
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error('Render Xəta (' + res.status + ')');
        const text = String(data.answer || data.response || data.result || data.output || data.text || data.message || '').trim();
        if (!text) throw new Error('Render boş cavab qaytardı.');
        return text;
      }

      throw new Error('Naməlum provayder: ' + prov);
    }

    async function runOmni(prompt) {
      const order = [cfg.active, 'gemini', 'groq', 'openrouter', 'render'].filter((v, i, a) => a.indexOf(v) === i);
      const errors = [];

      for (const prov of order) {
        const key = cfg.keys[prov] || '';
        if (prov !== 'render' && !key) continue;
        document.getElementById('stat').textContent = prov.toUpperCase() + ' cavab verir...';
        try {
          const answer = await callProvider(prov, key, prompt);
          return { ok: true, prov: prov.toUpperCase(), answer };
        } catch (err) {
          errors.push(err.message || String(err));
        }
      }

      return {
        ok: false,
        errorText: errors.length
          ? errors.join('\n')
          : 'Heç bir provayderdə API açarı yoxdur. Gemini açarını yapışdırıb "Yadda Saxla" basın.'
      };
    }

    async function sendMsg() {
      const inp = document.getElementById('inp');
      const prompt = inp.value.trim();
      if (!prompt) { inp.focus(); return; }
      inp.value = '';
      addBubble('u', 'SİZ', prompt);

      const res = await runOmni(prompt);
      if (res.ok) {
        document.getElementById('stat').textContent = 'Cavab: ' + res.prov;
        addBubble('b', res.prov, res.answer);
        if (res.answer.includes('```') || res.answer.includes('<script') || res.answer.includes('function ')) {
          document.getElementById('codeArea').value = res.answer;
        }
      } else {
        document.getElementById('stat').textContent = 'Bağlantı xətası';
        addBubble('err', 'XƏTA', res.errorText);
      }
    }

    async function sendPreset(text) {
      document.getElementById('inp').value = text;
      await sendMsg();
    }

    async function testGemini() {
      const pasted = document.getElementById('apiKey').value.replace(/\s+/g, '');
      if (pasted) {
        cfg.keys.gemini = pasted;
        cfg.active = 'gemini';
        localStorage.setItem(STORAGE_KEY, JSON.stringify(cfg));
        document.getElementById('apiKey').value = '';
        syncUI();
      }
      addBubble('u', 'TEST', 'Gemini bağlantısını yoxla');
      try {
        const ans = await callProvider('gemini', cfg.keys.gemini, 'Yalnız "Gemini aktivdir" yaz.');
        document.getElementById('stat').textContent = 'Gemini OK';
        addBubble('b', 'GEMINI-2.5-FLASH', ans);
      } catch (err) {
        document.getElementById('stat').textContent = 'Gemini Xətası';
        addBubble('err', 'GEMINI XƏTA', err.message);
      }
    }

    function checkSyntax() {
      const area = document.getElementById('codeArea');
      const raw = area.value.replace(/```[a-z]*\n?/gi, '').replace(/```/g, '').trim();
      if (!raw) {
        document.getElementById('stat').textContent = 'Kod sahəsi boşdur.';
        return;
      }
      try {
        new Function(raw);
        document.getElementById('stat').textContent = 'JS sintaksisi düzgündür.';
      } catch (err) {
        document.getElementById('stat').textContent = 'JS sintaksis xətası: ' + err.message;
      }
    }

    syncUI();
  </script>
</body>
</html>
