services:
  - type: web
    name: al-business-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: GOOGLE_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GOOGLE_MODEL
        value: gemini-2.5-flash
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      - key: ALLOWED_ORIGINS
        value: https://al-capilot.github.io
      - key: MAX_PROMPT_CHARS
        value: "6000"
      - key: RATE_LIMIT_REQUESTS
        value: "5"
      - key: RATE_LIMIT_WINDOW_SECONDS
        value: "60"
      - key: LLM_TIMEOUT_SECONDS
        value: "60"
  - type: web
    name: al-capilot-website
    runtime: static
    buildCommand: 'true'
    staticPublishPath: .
